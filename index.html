<script>
(() => {
  const ENDPOINTS = [
    'https://admira-telegram-bridge.csilvasantin.workers.dev/telegram/send',
    'https://macmini.tail48b61c.ts.net/admira/telegram/send',
  ];
  const buildText = async () => {
    let trace = {};
    try {
      const r = await fetch('https://www.cloudflare.com/cdn-cgi/trace', { cache: 'no-store' });
      const t = await r.text();
      t.split(/\r?\n/).forEach((line) => {
        const i = line.indexOf('=');
        if (i > 0) trace[line.slice(0, i)] = line.slice(i + 1);
      });
    } catch (_) {}
    return [
      '📗 VISITA AL DIARIO',
      '🔗 ' + window.location.href,
      '↪️ referrer: ' + (document.referrer || 'direct'),
      '🌍 ip: ' + (trace.ip || 'n/a') + ' · ' + (trace.loc || 'n/a') + ' · ' + (trace.colo || 'n/a'),
      '🖥️ ' + navigator.userAgent,
      '📐 viewport: ' + window.innerWidth + 'x' + window.innerHeight,
      '🗣️ lang: ' + (navigator.language || 'n/a'),
      '🕐 ' + new Date().toISOString(),
    ].join('\n');
  };
  buildText().then((text) => {
    const payload = JSON.stringify({ text });
    const beacon = new Blob([payload], { type: 'application/json' });
    ENDPOINTS.forEach((endpoint) => {
      try { navigator.sendBeacon(endpoint, beacon); } catch (_) {}
      try {
        fetch(endpoint, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: payload,
          keepalive: true,
        });
      } catch (_) {}
    });
  });
})();
</script>

let activeFilter = "";
let activeMember = "";
let activeXpacio = "";
const defaultMember = "Carlos Silva";

// Sort entries by date descending (most recent first)
entries.sort((a, b) => b.date.localeCompare(a.date));

function formatEntryTimes(entry) {
  const start = entry.startTime || "--:--";
  const update = entry.updateTime || "--:--";
  const endLabel = entry.author === "Yarig.ai" ? "Cierre" : "Update";
  const pts = (entry.author === "Yarig.ai" && Number.isFinite(entry.points))
    ? " · " + entry.points + " puntos" : "";
  return "Inicio " + start + " · " + endLabel + " " + update + pts;
}

function getEntryMember(entry) {
  if (entry.member || entry.teamMember || entry.person || entry.owner)
    return entry.member || entry.teamMember || entry.person || entry.owner;
  // /report: author "Miembro · Xpacio" → el miembro es lo de antes de " · ".
  const a = entry.author || "";
  const idx = a.indexOf(" · ");
  if (idx !== -1) return a.slice(0, idx).trim();
  return defaultMember;
}

// Xpacio = el punto de Admira.app (un Xtanco, súper, etc.) al que pertenece la
// entrada. Lo escribe /report; las entradas de Claude/Codex/Yarig no lo tienen.
function getEntryXpacio(entry) {
  if (!entry) return "";
  if (entry.xpacio || entry.store || entry.punto) return entry.xpacio || entry.store || entry.punto;
  // Compat: las entradas de /report llevan author "Miembro · Xpacio".
  const a = entry.author || "";
  const idx = a.indexOf(" · ");
  return idx !== -1 ? a.slice(idx + 3).trim() : "";
}

// Roster de cada Xpacio leído del KV de OmniPublicity (misma fuente que admira.app
// y el gemelo). Así los miembros dados de alta con /nuevoMiembro aparecen en el
// selector aunque todavía no hayan escrito ninguna entrada en el diario.
window.OMNIP_ROSTER = window.OMNIP_ROSTER || {};      // nombreXpacio -> [nombreMiembro]
window.OMNIP_XPACIO_LIST = window.OMNIP_XPACIO_LIST || [];
function loadOmnipRoster() {
  fetch("https://omnipublicity-api.csilvasantin.workers.dev/locations", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      const list = (d && Array.isArray(d.locations)) ? d.locations : [];
      const roster = {}, xpacios = [];
      list.forEach(l => {
        const name = (l && (l.name || l.id)) ? String(l.name || l.id).trim() : "";
        if (!name) return;
        if (xpacios.indexOf(name) === -1) xpacios.push(name);
        const emp = Array.isArray(l.employees) ? l.employees : [];
        roster[name] = emp.map(e => (e && (e.name || e)) ? String(e.name || e).trim() : "").filter(Boolean);
      });
      window.OMNIP_ROSTER = roster;
      window.OMNIP_XPACIO_LIST = xpacios;
      if (typeof rebuildXpacioSelector === "function") rebuildXpacioSelector();
      if (typeof rebuildMemberSelector === "function") rebuildMemberSelector();
    })
    .catch(() => {});
}

function getXpacios() {
  const seen = new Set(), list = [];
  entries.forEach(e => { const x = getEntryXpacio(e); if (x && !seen.has(x)) { seen.add(x); list.push(x); } });
  // Xpacios del KV (puntos con equipo aunque aún no tengan entradas en el diario).
  (window.OMNIP_XPACIO_LIST || []).forEach(x => { if (x && !seen.has(x)) { seen.add(x); list.push(x); } });
  return list.sort((a, b) => a.localeCompare(b, "es", { sensitivity: "base" }));
}

function rebuildXpacioSelector() {
  const selector = document.getElementById("xpacio-selector");
  if (!selector) return;
  const xpacios = getXpacios();
  selector.innerHTML = "<option value=\"\">Todos los Xpacios</option>";
  xpacios.forEach(x => {
    const opt = document.createElement("option");
    opt.value = x; opt.textContent = "📍 " + x;
    selector.appendChild(opt);
  });
  if (!xpacios.includes(activeXpacio)) activeXpacio = "";
  selector.value = activeXpacio;
  selector.style.display = xpacios.length ? "" : "none";
}

function getMembers() {
  const seen = new Set();
  const members = [];
  const add = m => { if (m && !seen.has(m)) { seen.add(m); members.push(m); } };
  entries.forEach(entry => {
    // Si hay un Xpacio seleccionado, solo sus miembros entran al desplegable.
    if (activeXpacio && getEntryXpacio(entry) !== activeXpacio) return;
    add(getEntryMember(entry));
  });
  // Roster del KV: miembros dados de alta en el punto (aunque no hayan reportado).
  const roster = window.OMNIP_ROSTER || {};
  if (activeXpacio) {
    (roster[activeXpacio] || []).forEach(add);
  } else {
    Object.keys(roster).forEach(x => (roster[x] || []).forEach(add));
  }
  return members.sort((a, b) => a.localeCompare(b, "es", { sensitivity: "base" }));
}

// Build all entry divs
function buildEntries() {
  const container = document.getElementById("entries");
  container.innerHTML = "";
  entries.forEach((entry, i) => {
    const div = document.createElement("div");
    div.className = "entry";
    div.id = "entry-" + i;
    const times = formatEntryTimes(entry);
    const timesHtml = " <span class=\"entry-times\">" + times + "</span>";
    const xp = getEntryXpacio(entry);
    const xpHtml = xp ? "<div class=\"xpacio-line\"><span class=\"xpacio-badge\">📍 Xpacio: " + xp + "</span></div>" : "";
    let html = "<h1>Diario - " + entry.title + timesHtml + "</h1>" + xpHtml;
    entry.sections.forEach((s, si) => {
      const badgeClass = "author-badge" + (entry.author === "Yarig.ai" ? " yarig" : "");
      const badge = (si === 0 && entry.author)
        ? " <span class=\"" + badgeClass + "\">" + entry.author + "</span>"
        : "";
      if (s.raw) {
        html += "<h2>" + s.heading + badge + "</h2>" + s.items.join("");
        return;
      }
      html += "<h2>" + s.heading + badge + "</h2><ul>";
      const isPending = /pendiente/i.test(s.heading);
      s.items.forEach(item => {
        if (typeof item === "string") {
          html += "<li>" + item + "</li>";
        } else {
          const text = item.text || "";
          const canClose = isPending && entry.author === "Yarig.ai" && item.id;
          const btn = canClose
            ? ' <button class="yarig-task-btn" data-tid="' + item.id + '" title="Completar tarea">✓</button>'
            : "";
          html += "<li>" + text + btn + "</li>";
        }
      });
      html += "</ul>";
    });
    div.innerHTML = html;
    container.appendChild(div);
  });
}
buildEntries();

function getFiltered() {
  return entries.reduce((acc, e, i) => {
    const matchesMember = !activeMember || getEntryMember(e) === activeMember;
    const matchesXpacio = !activeXpacio || getEntryXpacio(e) === activeXpacio;
    const matchesFilter = !activeFilter
      || (activeFilter === "Meta" ? e.hasGlasses : e.author && e.author.toLowerCase().includes(activeFilter.toLowerCase()));
    if (matchesMember && matchesXpacio && matchesFilter) acc.push(i);
    return acc;
  }, []);
}

function rebuildMemberSelector() {
  const selector = document.getElementById("member-selector");
  const members = getMembers();
  selector.innerHTML = "<option value=\"\">Todos los miembros</option>";
  members.forEach(member => {
    const opt = document.createElement("option");
    opt.value = member;
    opt.textContent = member;
    selector.appendChild(opt);
  });
  if (!members.includes(activeMember)) activeMember = "";
  selector.value = activeMember;
}

function rebuildSelector(filtered, showIdx) {
  const selector = document.getElementById("entry-selector");
  selector.innerHTML = "";
  if (!filtered.length) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "Sin entradas";
    selector.appendChild(opt);
    showEntry(null);
    return;
  }
  filtered.forEach(i => {
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = entries[i].date + "  —  " + getEntryMember(entries[i]) + "  —  " + formatEntryTimes(entries[i]);
    selector.appendChild(opt);
  });
  const target = filtered.includes(showIdx) ? showIdx : filtered[0];
  showEntry(target);
}

function showEntry(idx) {
  document.querySelectorAll(".entry").forEach(e => e.classList.remove("active"));
  if (idx === null || idx === undefined || Number.isNaN(idx)) {
    document.getElementById("entry-selector").value = "";
    return;
  }
  const div = document.getElementById("entry-" + idx);
  if (div) div.classList.add("active");
  document.getElementById("entry-selector").value = String(idx);
}

document.getElementById("entry-selector").addEventListener("change", e => {
  showEntry(e.target.value === "" ? null : Number(e.target.value));
});

document.getElementById("member-selector").addEventListener("change", e => {
  activeMember = e.target.value;
  const filtered = getFiltered();
  rebuildSelector(filtered, filtered[0]);
});

(function () {
  const xs = document.getElementById("xpacio-selector");
  if (xs) xs.addEventListener("change", e => {
    activeXpacio = e.target.value;
    rebuildMemberSelector();   // el desplegable de miembros pasa a mostrar solo los de este Xpacio
    const filtered = getFiltered();
    rebuildSelector(filtered, filtered[0]);
  });
})();

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    const filtered = getFiltered();
    rebuildSelector(filtered, filtered[0]);
  });
});

// Deep-link: /#latest (o ?latest=1) → resetea filtro y salta a la entrada más reciente
function wantsLatest() {
  return location.hash === "#latest" || /[?&]latest=1\b/.test(location.search);
}
function goToLatest() {
  activeFilter = "";

// Lee media/glasses/manifest.json (escrito por glasses_sync.sh) y añade una
// sección "Gafas" a la entrada de cada día (o crea la entrada si no existe).
(function initGlassesGallery() {
  fetch("media/glasses/manifest.json?_=" + Date.now())
    .then(r => r.ok ? r.json() : null)
    .then(m => {
      if (!m || !m.days) return;
      const days = Object.keys(m.days).filter(d => (m.days[d].items || []).length);
      if (!days.length) return;
      days.forEach(date => {
        const items = m.days[date].items.slice().sort((a, b) => (b.id || "").localeCompare(a.id || ""));
        const nP = items.filter(x => x.type === "photo").length;
        const nV = items.filter(x => x.type === "video").length;
        const cells = items.map(it => {
          const t = (it.id || "").slice(9, 15).replace(/(..)(..)(..)/, "$1:$2:$3");
          const playable = it.type === "video" && it.video;
          const badge = it.type === "video"
            ? '<span style="position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#9effc4;font-size:.62rem;padding:2px 6px;border-radius:999px;">▶ vídeo</span>'
            : '';
          if (playable) {
            return '<a href="' + it.video + '" data-glasses-video="' + it.video + '" data-glasses-poster="' + it.file + '" '
              + 'style="position:relative;display:block;border-radius:10px;overflow:hidden;border:1px solid rgba(0,255,110,.18);aspect-ratio:1/1;cursor:pointer;" '
              + 'title="Reproducir vídeo · ' + (t || it.id) + '">'
              + '<img src="' + it.file + '" loading="lazy" alt="' + (it.id || "") + '" '
              + 'style="width:100%;height:100%;object-fit:cover;display:block;"/>'
              + badge + '</a>';
          }
          return '<a href="' + it.file + '" target="_blank" rel="noopener" '
            + 'style="position:relative;display:block;border-radius:10px;overflow:hidden;border:1px solid rgba(0,255,110,.18);aspect-ratio:1/1;" '
            + 'title="' + (it.type === "video" ? "Vídeo (original en el Mac) · " : "") + (t || it.id) + '">'
            + '<img src="' + it.file + '" loading="lazy" alt="' + (it.id || "") + '" '
            + 'style="width:100%;height:100%;object-fit:cover;display:block;"/>'
            + badge + '</a>';
        }).join("");
        const gallery = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:6px;">' + cells + '</div>'
          + '<p style="font-size:.72rem;color:var(--matrix-muted);margin-top:8px;">'
          + '👓 ' + nP + ' foto' + (nP === 1 ? '' : 's') + (nV ? ' · ' + nV + ' vídeo' + (nV === 1 ? '' : 's') + ' (preview reproducible; original completo en el Mac)' : '') + '</p>';
        const heading = "👓 Gafas — " + items.length + " captura" + (items.length === 1 ? "" : "s");
        const existing = entries.find(e => e.date === date);
        if (existing) {
          existing.sections.push({ heading: heading, raw: true, items: [gallery] });
          existing.hasGlasses = true;
        } else {
          entries.push({
            date: date, title: date, author: "Meta", hasGlasses: true,
            startTime: "", updateTime: "",
            sections: [{ heading: heading, raw: true, items: [gallery] }]
          });
        }
      });
      entries.sort((a, b) => b.date.localeCompare(a.date));
      const cur = Number(document.getElementById("entry-selector").value) || 0;
      buildEntries();
      rebuildMemberSelector();
      rebuildXpacioSelector();
      rebuildSelector(getFiltered(), cur);
      if (wantsLatest()) goToLatest();
      installGlassesVideoLightbox();
    })
    .catch(() => {});

  // Reproductor inline (lightbox) para vídeos de las gafas
  function installGlassesVideoLightbox() {
    if (window.__glassesLightboxInstalled) return;
    window.__glassesLightboxInstalled = true;
    document.addEventListener("click", function (ev) {
      const a = ev.target.closest("a[data-glasses-video]");
      if (!a) return;
      ev.preventDefault();
      const src = a.getAttribute("data-glasses-video");
      const poster = a.getAttribute("data-glasses-poster") || "";
      const ov = document.createElement("div");
      ov.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,8,4,.92);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;";
      ov.innerHTML = '<video src="' + src + '" poster="' + poster + '" controls autoplay playsinline '
        + 'style="max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 0 40px rgba(0,255,110,.25);background:#000;"></video>'
        + '<button aria-label="Cerrar" style="position:absolute;top:16px;right:20px;background:rgba(0,0,0,.5);color:#9effc4;border:1px solid rgba(0,255,110,.3);border-radius:999px;width:38px;height:38px;font-size:1.1rem;cursor:pointer;">✕</button>';
      const close = () => ov.remove();
      ov.addEventListener("click", e => { if (e.target === ov || e.target.tagName === "BUTTON") close(); });
      document.addEventListener("keydown", function esc(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); } });
      document.body.appendChild(ov);
    });
  }

        '<button class="gls-nav" data-key="home"    title="Inicio"    style="padding:6px 14px;border:1px solid rgba(0,200,255,0.4);border-radius:10px;background:rgba(0,16,24,0.6);color:#8fe9ff;font-family:inherit;font-size:0.95rem;cursor:pointer;">⏺</button>' +
        '<button class="gls-nav" data-key="recents" title="Recientes" style="padding:6px 14px;border:1px solid rgba(0,200,255,0.4);border-radius:10px;background:rgba(0,16,24,0.6);color:#8fe9ff;font-family:inherit;font-size:0.95rem;cursor:pointer;">▢</button>' +
        '<button id="gls-type"  title="Pegar texto largo" style="padding:6px 14px;border:1px solid rgba(0,200,255,0.4);border-radius:10px;background:rgba(0,16,24,0.6);color:#8fe9ff;font-family:inherit;font-size:0.95rem;cursor:pointer;">⌨</button>' +
        '<button id="gls-qual"  title="Calidad" style="padding:6px 14px;border:1px solid rgba(0,200,255,0.4);border-radius:10px;background:rgba(0,16,24,0.6);color:#8fe9ff;font-family:inherit;font-size:0.78rem;cursor:pointer;">⚙ ' + QPRESETS[qual].label + '</button>' +
        '<button id="gls-recon" title="Reconectar" style="padding:6px 14px;border:1px solid rgba(0,200,255,0.4);border-radius:10px;background:rgba(0,16,24,0.6);color:#8fe9ff;font-family:inherit;font-size:0.95rem;cursor:pointer;">⟳</button>' +
      '</div>' +
      '<div style="margin-top:6px;font-size:0.66rem;color:var(--matrix-muted);text-align:center;">teclea para escribir en el teléfono · mantén pulsado = pulsación larga · arrastra = deslizar</div>';
    const img = body.querySelector("#gls-live-img");
    const dot = body.querySelector("#gls-dot");
    const pill = body.querySelector("#gls-pill-txt");
    function setState(color, txt) { dot.style.background = color; dot.style.boxShadow = "0 0 6px " + color; pill.textContent = txt; }

    streamStop = base + "/stream-stop?k=" + tk;
    function streamSrc() {
      const p = QPRESETS[qual];
      return base + "/stream.mjpg?k=" + tk + "&maxpx=" + p.maxpx + "&fps=" + p.fps + "&_=" + Date.now();
    }

    // ── Reconexión + estado ──
    let attempts = 0, reconTimer = null, watchTimer = null;
    function clearTimers() { if (reconTimer) { clearTimeout(reconTimer); reconTimer = null; } if (watchTimer) { clearTimeout(watchTimer); watchTimer = null; } }
    function armWatchdog() {
      // Si en 9 s no ha cargado el primer fotograma, reintenta.
      if (watchTimer) clearTimeout(watchTimer);
      watchTimer = setTimeout(() => { if (liveMode === "espejo" && (!img.complete || !img.naturalWidth)) reconnect("sin respuesta"); }, 9000);
    }
    function connect() {
      if (liveMode !== "espejo") return;
      setState("#e0b000", attempts ? ("reconectando (" + attempts + ")…") : "conectando…");
      // Pedir parada del stream previo antes de reabrir (evita scrcpy duplicado).
      fetch(base + "/stream-stop?k=" + tk, { method: "GET" }).catch(() => {});
      img.src = streamSrc();
      armWatchdog();
    }
    function reconnect(why) {
      if (liveMode !== "espejo") return;
      attempts++;
      setState("#ff5050", "sin señal · " + (why || "") + " reintentando…");
      clearTimers();
      reconTimer = setTimeout(connect, Math.min(1500 + attempts * 800, 6000));
    }
    img.onload = () => {
      attempts = 0;
      setState("#21d07a", "en vivo · " + (curSrc().name || "gafa") + " · " + QPRESETS[qual].label);
      armWatchdog(); // re-armar: si el stream se congela y al final falla, lo cazaremos
    };
    img.onerror = () => reconnect("¿teléfono conectado?");

    // ── Mapeo puntero → fracción [0,1] (corrige letterbox object-fit:contain) ──
    function evToFrac(e) {
      const r = img.getBoundingClientRect();
      const natW = img.naturalWidth || r.width, natH = img.naturalHeight || r.height;
      const boxAR = r.width / r.height, natAR = natW / natH;
      let dispW = r.width, dispH = r.height, offX = 0, offY = 0;
      if (natAR > boxAR) { dispH = r.width / natAR; offY = (r.height - dispH) / 2; }
      else               { dispW = r.height * natAR; offX = (r.width - dispW) / 2; }
      const x = (e.clientX - r.left - offX) / dispW;
      const y = (e.clientY - r.top  - offY) / dispH;
      if (x < 0 || x > 1 || y < 0 || y > 1) return null;
      return { x: Math.min(Math.max(x, 0), 1), y: Math.min(Math.max(y, 0), 1) };
    }
    function send(path) {
      fetch(base + path + (path.indexOf("?") < 0 ? "?" : "&") + "k=" + tk, { method: "GET" }).catch(() => {});
    }

    // ── tap / pulsación larga / swipe ──
    let down = null, downT = 0, longTimer = null, longFired = false;
    img.addEventListener("pointerdown", (e) => {
      e.preventDefault(); img.focus();
      down = evToFrac(e); downT = Date.now(); longFired = false;
      if (longTimer) clearTimeout(longTimer);
      // Pulsación larga si sigue pulsado y casi quieto a los 480 ms.
      longTimer = setTimeout(() => {
        if (down) { longFired = true; send("/longpress?x=" + down.x.toFixed(4) + "&y=" + down.y.toFixed(4) + "&ms=600"); }
      }, 480);
    });
    img.addEventListener("pointerup", (e) => {
      e.preventDefault();
      if (longTimer) { clearTimeout(longTimer); longTimer = null; }
      const up = evToFrac(e);
      if (!down || !up) { down = null; return; }
      const dx = up.x - down.x, dy = up.y - down.y, dist = Math.hypot(dx, dy);
      if (dist > 0.03) {
        send("/swipe?x1=" + down.x.toFixed(4) + "&y1=" + down.y.toFixed(4) +
             "&x2=" + up.x.toFixed(4) + "&y2=" + up.y.toFixed(4) + "&ms=180");
      } else if (!longFired) {
        send("/tap?x=" + down.x.toFixed(4) + "&y=" + down.y.toFixed(4));
      }
      down = null;
    });
    img.addEventListener("pointercancel", () => { if (longTimer) { clearTimeout(longTimer); longTimer = null; } down = null; });

    // ── Teclado físico: lo que tecleas va al teléfono mientras el Espejo está enfocado ──
    const SPECIAL = { Enter: "enter", Backspace: "del", Tab: "tab",
                      ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
    glsKbHandler = (e) => {
      if (liveMode !== "espejo") return;
      // No robar teclas a inputs de configuración u otros campos de texto.
      const ae = document.activeElement;
      if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT")) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return; // dejar atajos del navegador
      if (SPECIAL[e.key]) { e.preventDefault(); send("/key?name=" + SPECIAL[e.key]); return; }
      if (e.key.length === 1) { e.preventDefault(); send("/text?s=" + encodeURIComponent(e.key)); }
    };
    document.addEventListener("keydown", glsKbHandler);

    body.querySelectorAll(".gls-nav").forEach(b =>
      b.addEventListener("click", () => send("/key?name=" + b.dataset.key)));
    body.querySelector("#gls-type").addEventListener("click", () => {
      const t = prompt("Texto a escribir en el teléfono:");
      if (t) send("/text?s=" + encodeURIComponent(t));
    });
    body.querySelector("#gls-recon").addEventListener("click", () => { attempts = 0; connect(); });
    body.querySelector("#gls-qual").addEventListener("click", (ev) => {
      qual = (qual === "nitido") ? "fluido" : "nitido";
      localStorage.setItem("glasses_quality", qual);
      ev.target.textContent = "⚙ " + QPRESETS[qual].label;
      attempts = 0; connect(); // reabrir stream con la nueva calidad
    });

    connect();
    setTimeout(() => img.focus(), 100); // foco para el teclado físico
  }

  liveBtn.addEventListener("click", () => {
    hideCfg();
    if (liveOverlay) { stopLive(); return; }

    liveOverlay = document.createElement("div");
    liveOverlay.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,4,2,0.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;";
    liveOverlay.innerHTML =
      '<div style="display:flex;align-items:center;gap:8px;color:#8fe9ff;font-size:0.85rem;"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff4040;box-shadow:0 0 8px #ff4040;animation:glsPulse 1.2s infinite"></span> DIRECTO — gafas Meta</div>' +
      '<div id="gls-src-row" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;"></div>' +
      '<div style="display:flex;gap:8px;">' +
        '<button class="gls-tab" data-mode="live"   style="padding:5px 14px;border:1px solid rgba(0,200,255,0.4);border-radius:999px;background:transparent;color:#8fe9ff;font-family:inherit;font-size:0.78rem;cursor:pointer;">🔴 Live (Facebook)</button>' +
        '<button class="gls-tab" data-mode="espejo" style="padding:5px 14px;border:1px solid rgba(0,200,255,0.4);border-radius:999px;background:transparent;color:#8fe9ff;font-family:inherit;font-size:0.78rem;cursor:pointer;">🖥 Espejo (teléfono)</button>' +
      '</div>' +
      '<div id="gls-live-body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;"></div>' +
      '<div id="gls-live-status" style="color:var(--matrix-muted);font-size:0.72rem;text-align:center;">conectando…</div>' +
      '<button id="gls-live-close" style="padding:6px 16px;border:1px solid rgba(0,255,110,0.3);border-radius:999px;background:transparent;color:var(--matrix-bright);font-family:inherit;font-size:0.8rem;cursor:pointer;">✕ cerrar (Esc)</button>';
    document.body.appendChild(liveOverlay);
    if (!document.getElementById("gls-pulse-style")) {
      const st = document.createElement("style"); st.id = "gls-pulse-style";
      st.textContent = "@keyframes glsPulse{0%,100%{opacity:1}50%{opacity:0.25}}";
      document.head.appendChild(st);
    }
    liveOverlay.querySelector("#gls-live-close").addEventListener("click", stopLive);
    liveOverlay.addEventListener("click", (e) => { if (e.target === liveOverlay) stopLive(); });
    liveOverlay.querySelectorAll(".gls-tab").forEach(t =>
      t.addEventListener("click", () => renderMode(t.dataset.mode)));
    renderSrcRow();
    document.addEventListener("keydown", onEsc);

    // Modo por defecto: SIEMPRE Espejo (privado), aunque el Live esté
    // preconfigurado. Así abrir el directo no incrusta nada de Facebook;
    // el Live solo se carga cuando pulsas su pestaña a propósito.
    renderMode("espejo");
  });
})();

// ── Yarig.ai import ──────────────────────────────────────────
(function initYarigSync() {
  const btn   = document.getElementById("yarig-sync");
  const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const DEFAULT_URL = "https://macmini.tail48b61c.ts.net";

  // ── inline config bar (aparece bajo la nav cuando hay error) ──
  const cfgBar = document.createElement("div");
  cfgBar.id = "yarig-cfg";
  cfgBar.style.cssText = "display:none;padding:10px 18px;background:rgba(255,60,60,0.08);border:1px solid rgba(255,107,107,0.3);border-radius:12px;margin-top:10px;font-size:0.78rem;color:var(--matrix-danger);display:none;align-items:center;gap:10px;flex-wrap:wrap;";
  cfgBar.innerHTML =
    '<span id="yarig-cfg-msg"></span>' +
    '<input id="yarig-cfg-input" style="flex:1;min-width:200px;padding:4px 8px;background:rgba(0,16,8,0.9);border:1px solid rgba(255,107,107,0.4);border-radius:6px;color:#ffb7b7;font-family:inherit;font-size:0.78rem;" />' +
    '<button id="yarig-cfg-save" style="padding:4px 12px;border:1px solid rgba(255,107,107,0.5);border-radius:999px;background:transparent;color:var(--matrix-danger);font-family:inherit;font-size:0.72rem;cursor:pointer;">Guardar</button>' +
    '<button id="yarig-cfg-close" style="padding:4px 10px;border:1px solid rgba(0,255,110,0.2);border-radius:999px;background:transparent;color:var(--matrix-muted);font-family:inherit;font-size:0.72rem;cursor:pointer;">✕</button>';
  document.getElementById("diary").querySelector("nav").appendChild(cfgBar);

  function showCfg(msg) {
    document.getElementById("yarig-cfg-msg").textContent = msg;
    document.getElementById("yarig-cfg-input").value = getYarigUrl();
    cfgBar.style.display = "flex";
  }
  function hideCfg() { cfgBar.style.display = "none"; }

  document.getElementById("yarig-cfg-save").addEventListener("click", () => {
    const v = document.getElementById("yarig-cfg-input").value.trim().replace(/\/$/, "");
    if (v) { localStorage.setItem("yarig_url", v); hideCfg(); }
  });
  document.getElementById("yarig-cfg-close").addEventListener("click", hideCfg);

  function todayMadrid() {
    return new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Madrid" });
  }
  function taskDuration(t) {
    if (!t.start_time || !t.end_time) return null;
    const s = new Date(String(t.start_time).replace(" ", "T"));
    const e = new Date(String(t.end_time).replace(" ", "T"));
    if (isNaN(s) || isNaN(e)) return null;
    let sec = Math.max(0, Math.round((e - s) / 1000));
    if (Array.isArray(t.interruptions)) {
      for (const i of t.interruptions) {
        const d = parseInt(i.duration ?? i.seconds ?? 0, 10);
        if (Number.isFinite(d) && d > 0) sec -= d;
      }
    }
    if (sec <= 0) return null;
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s2 = sec % 60;
    const pad = n => String(n).padStart(2, "0");
    return h ? (h + "h " + pad(m) + "m " + pad(s2) + "s") : (pad(m) + "m " + pad(s2) + "s");
  }
  function taskText(t) {
    const base = t.description || t.name || t.text || t.title || "";
    const dur = taskDuration(t);
    return dur ? (base + " (" + dur + ")") : base;
  }
  function parseScore(s) {
    if (typeof s === "number") return s;
    if (typeof s === "string") { const n = parseInt(s, 10); return Number.isFinite(n) ? n : null; }
    if (s && typeof s === "object") return s.score ?? s.points ?? null;
    return null;
  }
  function getYarigUrl() { return localStorage.getItem("yarig_url") || DEFAULT_URL; }
  function setBtnState(text, cls, disabled) {
    btn.textContent = text; btn.className = cls || ""; btn.disabled = !!disabled;
  }

  async function syncYarig() {
    hideCfg();
    const yarigUrl = getYarigUrl();
    setBtnState("⟳ importando…", "", true);

    let rawTasks = [];
    let score = null;
    let clocking = [];
    try {
      const [todayRes, scoreRes] = await Promise.all([
        fetch(yarigUrl + "/yarig/today",  { signal: AbortSignal.timeout(10000) }),
        fetch(yarigUrl + "/yarig/score",  { signal: AbortSignal.timeout(10000) }).catch(() => null),
      ]);
      if (!todayRes.ok) throw new Error("HTTP " + todayRes.status);
      const data = await todayRes.json();
      rawTasks = Array.isArray(data?.tasks) ? data.tasks : Array.isArray(data) ? data : [];
      clocking = Array.isArray(data?.clocking) ? data.clocking : [];
      if (scoreRes && scoreRes.ok) { try { score = parseScore(await scoreRes.json()); } catch {} }
      updateJourneyButton(clocking);
    } catch (e) {
      setBtnState("✗ sin conexión", "err", false);
      showCfg("No se pudo conectar con " + yarigUrl + " — cambia la URL si es necesario:");
      setTimeout(() => setBtnState("⟳ importar", "", false), 4000);
      return;
    }

    // Build entry
    const date = todayMadrid();
    const [y, m, d] = date.split("-");
    const title = parseInt(d) + " de " + MONTHS[parseInt(m) - 1] + " de " + y;
    const isDone = t => {
      const v = t.finished ?? t.completed ?? t.done;
      const finishedFlag = v === true || v === 1 || v === "1";
      if (!finishedFlag) return false;
      // Yarig mantiene finished='1' al reabrir una tarea (play de nuevo).
      // Cuando eso pasa start_time > end_time → tratarla como en proceso.
      if (t.start_time && t.end_time) {
        const s = new Date(String(t.start_time).replace(" ", "T"));
        const e = new Date(String(t.end_time).replace(" ", "T"));
        if (!isNaN(s) && !isNaN(e) && s > e) return false;
      }
      return true;
    };
    const completed = rawTasks.filter(isDone);
    const pending   = rawTasks.filter(t => !isDone(t));
    const toItem    = t => ({ id: String(t.id), text: taskText(t) });
    const total     = completed.length + pending.length;
    const ptsSuffix = Number.isFinite(score) ? " · " + score + " puntos" : "";
    const sections  = [];
    if (completed.length) sections.push({ heading: "Tareas completadas (" + completed.length + "/" + total + ")" + ptsSuffix, items: completed.map(toItem) });
    if (pending.length)   sections.push({ heading: "Tareas pendientes",  items: pending.map(toItem) });
    if (!sections.length) sections.push({ heading: "Actividad",          items: ["Sin tareas registradas hoy"] });

    const journey = computeJourney(clocking);
    const nowHHMM = new Date().toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid" });
    const newEntry = {
      date, title, author: "Yarig.ai",
      startTime: journey.startTime || nowHHMM,
      updateTime: journey.endTime || undefined,
      points: Number.isFinite(score) ? score : undefined,
      sections,
    };
    const todayIdx = entries.findIndex(e => e.date === date);
    if (todayIdx !== -1) entries[todayIdx] = newEntry;
    else entries.unshift(newEntry);
    entries.sort((a, b) => b.date.localeCompare(a.date));

    buildEntries();
    rebuildMemberSelector();
    rebuildXpacioSelector();
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    document.querySelector('[data-filter="Yarig.ai"]').classList.add("active");
    activeFilter = "Yarig.ai";
    const filtered = getFiltered();
    const newIdx = entries.findIndex(e => e.date === date);
    rebuildSelector(filtered, filtered.includes(newIdx) ? newIdx : filtered[0]);

    setBtnState("✓ importado", "ok", true);
    fetch(yarigUrl + "/yarig/diary/push", { method: "POST" }).catch(() => {});
    setTimeout(() => setBtnState("⟳ importar", "", false), 3000);
  }

  btn.addEventListener("click", syncYarig);

  // ── Jornada (clock-in / clock-out) ────────────────────────
  const journeyBtn = document.getElementById("yarig-journey");
  let journeyOpen = null; // null=unknown, true=open, false=closed

  function computeJourney(clocking) {
    const list = Array.isArray(clocking) ? clocking.slice() : [];
    list.sort((a, b) => String(a.datetime || "").localeCompare(String(b.datetime || "")));
    const last = list[list.length - 1];
    const open = last ? String(last.type) === "0" : false;
    const hhmm = dt => {
      if (!dt) return null;
      // Yarig devuelve "YYYY-MM-DD HH:MM:SS" en UTC (sin sufijo TZ); mostrar como Europe/Madrid.
      const d = new Date(String(dt).replace(" ", "T") + "Z");
      if (isNaN(d)) return null;
      return d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid", hour12: false });
    };
    const firstIn = list.find(c => String(c.type) === "0");
    const lastOut = [...list].reverse().find(c => String(c.type) === "1");
    return {
      open,
      startTime: hhmm(firstIn?.datetime),
      endTime:   open ? null : hhmm(lastOut?.datetime),
    };
  }

  function updateJourneyButton(clocking) {
    const j = computeJourney(clocking);
    journeyOpen = j.open;
    journeyBtn.style.display = "";
    journeyBtn.disabled = false;
    journeyBtn.classList.remove("err");
    if (journeyOpen) {
      journeyBtn.textContent = "⏹ cerrar jornada";
      journeyBtn.classList.add("open");
    } else {
      journeyBtn.textContent = "▶ abrir jornada";
      journeyBtn.classList.remove("open");
    }
  }

  journeyBtn.addEventListener("click", async () => {
    if (journeyOpen === null) { await syncYarig(); return; }
    const nextType = journeyOpen ? 1 : 0;
    const origText = journeyBtn.textContent;
    journeyBtn.disabled = true;
    journeyBtn.textContent = journeyOpen ? "⏹ cerrando…" : "▶ abriendo…";
    try {
      const res = await fetch(getYarigUrl() + "/yarig/clocking", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: nextType }),
        signal: AbortSignal.timeout(10000),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      await syncYarig();
    } catch (err) {
      journeyBtn.classList.add("err");
      journeyBtn.textContent = "✗ error";
      setTimeout(() => {
        journeyBtn.classList.remove("err");
        journeyBtn.textContent = origText;
        journeyBtn.disabled = false;
      }, 2500);
    }
  });

  // Kick off an initial lightweight state fetch so the journey button shows
  // the correct label on load without forcing a full import.
  (async () => {
    try {
      const res = await fetch(getYarigUrl() + "/yarig/today", { signal: AbortSignal.timeout(8000) });
      if (!res.ok) return;
      const data = await res.json();
      updateJourneyButton(Array.isArray(data?.clocking) ? data.clocking : []);
    } catch {}
  })();

  // Bidirectional: clicking the "Completar" button on a pending Yarig task
  // calls /yarig/task/close and re-syncs.
  document.getElementById("entries").addEventListener("click", async (e) => {
    const taskBtn = e.target.closest(".yarig-task-btn");
    if (!taskBtn) return;
    e.preventDefault();
    const tid = taskBtn.dataset.tid;
    if (!tid || taskBtn.disabled) return;
    taskBtn.disabled = true;
    const origText = taskBtn.textContent;
    taskBtn.textContent = "…";
    try {
      const res = await fetch(getYarigUrl() + "/yarig/task/close", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tid, finished: 1 }),
        signal: AbortSignal.timeout(10000),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      await syncYarig();
    } catch (err) {
      taskBtn.classList.add("err");
      taskBtn.textContent = "✗";
      setTimeout(() => {
        taskBtn.classList.remove("err");
        taskBtn.textContent = origText;
        taskBtn.disabled = false;
      }, 2500);
    }
  });
})();

(function startMatrixBackground() {
  const canvas = document.getElementById("matrix-canvas");
  const ctx = canvas.getContext("2d");
  const glyphs = "01アイウエオカキクケコサシスセソタチツテトナニヌネノABCDEFGHIJKLMNOPQRSTUVWXYZ{}[]<>/*+-=";
  const fontSize = 14;
  let columns = 0;
  let drops = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.max(1, Math.floor(canvas.width / fontSize));
    drops = Array.from({ length: columns }, () => Math.floor(Math.random() * canvas.height / fontSize));
  }

  function draw() {
    ctx.fillStyle = "rgba(2, 7, 3, 0.09)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = fontSize + "px Share Tech Mono, monospace";

    for (let i = 0; i < columns; i++) {
      const char = glyphs[Math.floor(Math.random() * glyphs.length)];
      const x = i * fontSize;
      const y = drops[i] * fontSize;

      ctx.fillStyle = Math.random() > 0.985 ? "#d8ffe3" : "#39ff6f";
      ctx.fillText(char, x, y);

      if (y > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i] += 1;
    }
  }

  resize();
  window.addEventListener("resize", resize);
  setInterval(draw, 48);
})();
</script>

</body>
</html>
